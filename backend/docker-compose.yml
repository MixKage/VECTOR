x-api-base: &api-base
  build: .
  env_file:
    - .env
  depends_on:
    - db
    - redis
  volumes:
    - ./:/code
  expose:
    - "8000"

services:
  frontend:
    build: ./frontend
    working_dir: /app
    environment:
      - VITE_API_BASE=/api
    volumes:
      - ./frontend:/app
      - /app/node_modules

  api1:
    <<: *api-base

  api2:
    <<: *api-base

  nginx:
    image: nginx:1.27
    depends_on:
      - api1
      - api2
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"

volumes:
  pgdata: {}
